# This workflow will run daily at 06:45.
# It will install Python dependencies and run tests with a variety of Python versions.
# See documentation for help debugging smoke test issues:
#    https://lincc-ppt.readthedocs.io/en/latest/practices/ci_testing.html#version-culprit

name: Unit test smoke test

on:

  # Runs this workflow automatically
  schedule:
    - cron: 45 6 * * 1-5

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions: {}

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
    - name: Install dependencies
      run: |
        sudo apt-get update
        uv pip install --system -e .[dev]
        if [ -f requirements.txt ]; then uv pip install --system -r requirements.txt; fi
    - name: List dependencies
      run: |
        pip list
    - name: Run unit tests with pytest
      run: |
        python -m pytest -o log_cli=true -vv

  notify:

    needs: build
    # Only notify if the workflow failed and was not manually started. Customize this as necessary.
    if: ${{ failure() && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
    - name: Send status to author's email
      uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968  # v22
      with:
        # Required mail server address if not connection_url:
        server_address: smtp.gmail.com
        # Server port: (uses TLS by default if server_port is 465)
        server_port: 465

        # Mail server username:
        username: ${{secrets.MAIL_USERNAME}}
        # Mail server password:
        password: ${{secrets.MAIL_PASSWORD}}
        # Required recipients' addresses:
        to: lincc-frameworks-team@lists.lsst.org

        # Required mail subject:
        subject: Smoke test ${{ needs.build.result }} in ${{github.repository}}
        # Required sender full name:
        from: GitHub Actions Report
        # Optional body:
        html_body: |
          <!DOCTYPE html>
          <html>
          <body>
          <h3>Smoke test ${{ needs.build.result }}</h3>
          <p>The smoke test in <b>${{ github.repository }}</b> has completed with result: <b>${{ needs.build.result }}</b></p>
          <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          </a></p>
          </body>
          </html>
          